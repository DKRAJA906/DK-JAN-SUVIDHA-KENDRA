<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadhaar PDF Crop & Print</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { margin: 0; background: #f2f5f9; color: #111; }
  header {
    background: #0b5fff; color: #fff; padding: 16px;
    text-align: center; font-weight: bold;
  }
  .wrap { max-width: 1000px; margin: auto; padding: 16px; }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  label { display:block; font-weight:bold; margin: 10px 0 5px; }
  input[type=file], input[type=password] {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
  }
  button {
    background: #0b5fff; color: #fff; border: 0; padding: 12px 18px;
    border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  button:disabled { background: #9db8e8; cursor: not-allowed; }
  .pdfArea {
    position: relative; overflow: auto; border: 1px solid #ddd;
    background: #eee; border-radius: 8px; margin-top: 12px;
  }
  canvas { display:block; max-width:100%; }
  #cropBox {
    position:absolute; border:2px dashed red; background:rgba(255,0,0,.15);
    display:none; pointer-events:none;
  }
  .hint { font-size:14px; color:#555; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:220px; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      position: fixed; left: 50%; top: 20mm;
      transform: translateX(-50%);
    }
  }
</style>
</head>

<body>

<header>
  आधार PDF क्रॉप एवं कार्ड-साइज प्रिंट टूल
</header>

<div class="wrap">

  <div class="card">
    <h3>1. Aadhaar PDF अपलोड करें</h3>
    <label>Aadhaar PDF चुनें</label>
    <input type="file" id="pdfFile" accept="application/pdf">

    <label>PDF Password (अगर लगा हो)</label>
    <input type="password" id="pdfPass" placeholder="जैसे: RAHU1990">

    <button id="loadBtn">PDF खोलें</button>
    <p class="hint">
      यह PDF आपके browser में ही process होगी। कोई भी Aadhaar file server पर नहीं जाएगी।
    </p>
  </div>

  <div class="card" id="cropCard" style="display:none">
    <h3>2. Aadhaar Card Area Select करें</h3>
    <p class="hint">
      Mouse से PDF पर Aadhaar card के चारों कोनों को cover करते हुए box बनाएं।  
      फिर नीचे <b>Crop & Print</b> दबाएं।
    </p>

    <div class="pdfArea" id="pdfArea">
      <canvas id="pdfCanvas"></canvas>
      <div id="cropBox"></div>
    </div>

    <div class="row">
      <div>
        <label>Card Size</label>
        <select id="cardSize">
          <option value="85.6,53.98">Aadhaar / PVC Card Size — 85.6 × 54 mm</option>
          <option value="90,55">Bada Card — 90 × 55 mm</option>
          <option value="100,60">Bada Card — 100 × 60 mm</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="cropBtn" disabled>Crop & Print</button>
      </div>
    </div>
  </div>

</div>

<div id="printArea" style="display:none"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fileInput = document.getElementById("pdfFile");
const passInput = document.getElementById("pdfPass");
const loadBtn = document.getElementById("loadBtn");
const cropBtn = document.getElementById("cropBtn");
const pdfArea = document.getElementById("pdfArea");
const canvas = document.getElementById("pdfCanvas");
const cropBox = document.getElementById("cropBox");
const printArea = document.getElementById("printArea");

let pdfDoc = null;
let renderedWidth = 0;
let renderedHeight = 0;
let start = null;
let crop = null;

loadBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    alert("पहले Aadhaar PDF चुनें।");
    return;
  }

  const arrayBuffer = await file.arrayBuffer();

  try {
    const loadingTask = pdfjsLib.getDocument({
      data: arrayBuffer,
      password: passInput.value || undefined
    });

    pdfDoc = await loadingTask.promise;
    const page = await pdfDoc.getPage(1);

    const scale = 2;
    const viewport = page.getViewport({ scale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = "100%";
    canvas.style.height = "auto";

    const ctx = canvas.getContext("2d");
    await page.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise;

    renderedWidth = viewport.width;
    renderedHeight = viewport.height;

    document.getElementById("cropCard").style.display = "block";
    cropBtn.disabled = false;

  } catch (err) {
    alert("PDF नहीं खुली। Password सही है या नहीं जांचें।

" + err.message);
  }
});

canvas.addEventListener("mousedown", e => {
  const rect = canvas.getBoundingClientRect();
  start = {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
  cropBox.style.display = "block";
});

canvas.addEventListener("mousemove", e => {
  if (!start) return;
  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  cropBox.style.left = Math.min(start.x, x) + "px";
  cropBox.style.top = Math.min(start.y, y) + "px";
  cropBox.style.width = Math.abs(x - start.x) + "px";
  cropBox.style.height = Math.abs(y - start.y) + "px";
});

canvas.addEventListener("mouseup", e => {
  if (!start) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  crop = {
    x1: Math.min(start.x, x),
    y1: Math.min(start.y, y),
    x2: Math.max(start.x, x),
    y2: Math.max(start.y, y)
  };

  start = null;
});

cropBtn.addEventListener("click", () => {
  if (!crop || (crop.x2 - crop.x1) < 20 || (crop.y2 - crop.y1) < 20) {
    alert("पहले Aadhaar card area select करें।");
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const displayWidth = rect.width;

  const ratio = renderedWidth / displayWidth;

  const sx = crop.x1 * ratio;
  const sy = crop.y1 * ratio;
  const sw = (crop.x2 - crop.x1) * ratio;
  const sh = (crop.y2 - crop.y1) * ratio;

  const out = document.createElement("canvas");
  out.width = sw;
  out.height = sh;

  out.getContext("2d").drawImage(
    canvas,
    sx, sy, sw, sh,
    0, 0, sw, sh
  );

  const size = document.getElementById("cardSize").value.split(",");
  const wmm = size[0];
  const hmm = size[1];

  printArea.innerHTML = "";
  printArea.style.display = "block";

  const img = document.createElement("img");
  img.src = out.toDataURL("image/png");
  img.style.width = wmm + "mm";
  img.style.height = hmm + "mm";
  img.style.display = "block";

  printArea.appendChild(img);

  setTimeout(() => window.print(), 300);
});
</script>

</body>
</html>
