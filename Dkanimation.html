<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Flower Plant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    background: linear-gradient(to bottom, #9be7ff, #e8faff 65%, #b8e994);
}

/* Sun */
.sun {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ffd93d;
    box-shadow: 0 0 40px #ffd93d;
}

/* Clouds */
.cloud {
    position: absolute;
    width: 130px;
    height: 45px;
    border-radius: 50px;
    background: white;
    opacity: .8;
    animation: moveCloud 18s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    top: -25px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    top: -35px;
}

.cloud1 {
    top: 100px;
    left: -160px;
}

.cloud2 {
    top: 180px;
    left: -300px;
    transform: scale(.7);
    animation-delay: 7s;
}

@keyframes moveCloud {
    from { transform: translateX(0); }
    to { transform: translateX(120vw); }
}

/* Ground */
.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100px;
    background: #68b04b;
    border-radius: 50% 50% 0 0;
}

/* Pot */
.pot {
    position: relative;
    z-index: 5;
    width: 150px;
    height: 115px;
    margin-bottom: 25px;
    background: linear-gradient(90deg, #b85c38, #e47a4d, #a94e31);
    clip-path: polygon(8% 0, 92% 0, 78% 100%, 22% 100%);
    border-radius: 0 0 25px 25px;
}

.pot::before {
    content: "";
    position: absolute;
    top: 0;
    left: -8px;
    width: 166px;
    height: 25px;
    border-radius: 15px;
    background: #7d3f29;
}

/* Plant */
.plant {
    position: absolute;
    bottom: 130px;
    left: 50%;
    width: 10px;
    height: 0;
    transform: translateX(-50%);
    background: #3b8f35;
    border-radius: 10px;
    z-index: 4;
    animation: growStem 3s ease-out forwards;
}

@keyframes growStem {
    to {
        height: 270px;
    }
}

/* Leaves */
.leaf {
    position: absolute;
    width: 90px;
    height: 45px;
    background: #48a942;
    border-radius: 100% 0 100% 0;
    opacity: 0;
}

.leaf.left {
    left: -82px;
    transform: rotate(-25deg);
    animation: showLeaf 1s 2s forwards, sway 3s 3s infinite ease-in-out;
}

.leaf.right {
    left: 2px;
    transform: scaleX(-1) rotate(-25deg);
    animation: showLeaf 1s 2.4s forwards, sway 3s 3.2s infinite ease-in-out;
}

@keyframes showLeaf {
    to {
        opacity: 1;
    }
}

@keyframes sway {
    0%,100% { transform: rotate(-25deg); }
    50% { transform: rotate(-15deg); }
}

/* Flower */
.flower {
    position: absolute;
    top: -25px;
    left: 50%;
    width: 110px;
    height: 110px;
    transform: translateX(-50%) scale(0);
    animation: bloom 2s 3s ease-out forwards;
}

@keyframes bloom {
    0% {
        transform: translateX(-50%) scale(0);
    }
    70% {
        transform: translateX(-50%) scale(1.15);
    }
    100% {
        transform: translateX(-50%) scale(1);
    }
}

/* Petals */
.petal {
    position: absolute;
    width: 48px;
    height: 70px;
    background: #ff5c8a;
    border-radius: 50% 50% 45% 45%;
    left: 31px;
    top: 5px;
    transform-origin: 50% 90%;
    box-shadow: 0 0 12px rgba(255, 80, 130, .5);
}

.p1 { transform: rotate(0deg); }
.p2 { transform: rotate(72deg); }
.p3 { transform: rotate(144deg); }
.p4 { transform: rotate(216deg); }
.p5 { transform: rotate(288deg); }

/* Flower center */
.center {
    position: absolute;
    width: 38px;
    height: 38px;
    background: #ffd43b;
    border-radius: 50%;
    left: 36px;
    top: 36px;
    z-index: 2;
    box-shadow: 0 0 15px #ffd43b;
}

/* Little floating particles */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: .7;
    animation: float 4s infinite ease-in-out;
}

.particle:nth-child(1) {
    left: 20%;
    bottom: 30%;
}

.particle:nth-child(2) {
    left: 70%;
    bottom: 40%;
    animation-delay: 1s;
}

.particle:nth-child(3) {
    left: 35%;
    bottom: 55%;
    animation-delay: 2s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
        opacity: .3;
    }
    50% {
        transform: translateY(-40px);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="ground"></div>

<!-- Plant -->
<div class="plant">

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="flower">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="center"></div>
    </div>

</div>

<div class="pot"></div>

</body>
</html>
