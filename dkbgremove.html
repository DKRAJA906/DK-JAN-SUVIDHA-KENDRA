<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Background Remover</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .container { display: flex; gap: 20px; margin-top: 20px; }
    img { max-width: 300px; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Image Background Remover</h2>

  <input type="file" id="imageInput" accept="image/*" />
  <button id="uploadBtn">Background Remove Karein</button>

  <p id="statusMsg" style="color: blue; display: none;">Background remove ho raha hai, please wait...</p>

  <div class="container">
    <div>
      <h3>Original Image</h3>
      <img id="originalImg" src="" alt="" />
    </div>
    <div>
      <h3>Background Removed</h3>
      <img id="resultImg" src="" alt="" />
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');

    // File select karte hi preview dikhayein
    imageInput.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        originalImg.src = URL.createObjectURL(e.target.files[0]);
      }
    });

    // Button click par API call
    uploadBtn.addEventListener('click', async () => {
      if (!imageInput.files[0]) {
        alert("Pehle image select karein!");
        return;
      }

      statusMsg.style.display = 'block';
      resultImg.src = '';

      const formData = new FormData();
      formData.append('file', imageInput.files[0]);

      try {
        const response = await fetch("https://dk-bg-remove.onrender.com/remove-bg", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Server Error: " + response.status);
        }

        const blob = await response.blob();
        resultImg.src = URL.createObjectURL(blob);
        statusMsg.style.display = 'none';

      } catch (err) {
        statusMsg.style.display = 'none';
        alert("Error aagaya: " + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
